id: sign-jar-cancel
action: SignJarAction
slice: sign
requires:
  - file
tags: [entry-keypair, sign]
entry: sign-jar
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: sign/runtime-pkcs12-keypair.p12
        entries:
          - alias: keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection:
      - keypair
when:
  - signJar:
      path: sign/signed.jar
      password: TEST_PASSWORD
  - cancel: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - errorId: cancelled
  - fileExists:
      path: sign/signed.jar
      exists: false
