id: paste-buffer-empty
action: PasteAction
slice: clipboard
requires:
  - file
  - delete-rename
tags: [core, clipboard]
entry: paste
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12
  - buffer: empty
when:
  - paste: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - entryCount: 1
  - dirty: false
  - buffer: empty
  - clipboardContains:
      kind: empty
  - dialogShown: null
  - errorId: bufferEmpty
  - controlEnabled:
      id: menu.edit.paste
      enabled: false
