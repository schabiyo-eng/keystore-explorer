id: copy-trusted-certificate
action: CopyTrustedCertificateAction
slice: clipboard
requires:
  - file
  - delete-rename
tags: [entry-trusted, clipboard]
entry: copy-trusted-certificate
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: trust
            entryType: TRUSTED_CERT
  - activeStore: runtime-pkcs12
  - selection:
      - trust
  - buffer: empty
when:
  - copyTrustedCertificate: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - trust
  - entryType:
      alias: trust
      type: TRUSTED_CERT
  - entryCount: 1
  - selectedAliases:
      - trust
  - dirty: false
  - buffer: copy
  - clipboardContains:
      kind: empty
  - dialogShown: null
  - controlEnabled:
      id: menu.edit.paste
      enabled: true
