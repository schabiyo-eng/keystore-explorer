id: cut-key-pair-empty-selection
action: CutKeyPairAction
slice: clipboard
requires:
  - file
  - delete-rename
tags: [entry-keypair, clipboard]
entry: cut-key-pair
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection: []
  - buffer: empty
when:
  - cutKeyPair: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - entryCount: 1
  - selectedAliases: []
  - dirty: false
  - buffer: empty
  - clipboardContains:
      kind: empty
  - dialogShown: null
  - errorId: emptySelection
  - controlEnabled:
      id: menu.edit.paste
      enabled: false
