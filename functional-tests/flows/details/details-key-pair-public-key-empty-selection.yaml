id: details-key-pair-public-key-empty-selection
action: KeyPairPublicKeyDetailsAction
slice: details
requires: [file]
tags: [entry-keypair, details]
entry: key-pair-public-key-details
skipOn: []
blocked: false
blockedReason: null
given:
