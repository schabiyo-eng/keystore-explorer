  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryCount: 1
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - selectedAliases: []
  - dirty: true
  - errorId: emptySelection
  - dialogShown: null
