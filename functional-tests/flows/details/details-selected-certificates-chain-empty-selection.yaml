id: details-selected-certificates-chain-empty-selection
action: SelectedCertificatesChainDetailsAction
slice: details
requires: [file]
tags: [core, details]
entry: selected-certificates-chain-details
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: true
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
          - alias: trusted-leaf
            entryType: TRUSTED_CERT
  - activeStore: runtime-pkcs12
  - selection: []
when:
  - openDetails:
      kind: selectedCertificatesChain
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
      - trusted-leaf
  - entryCount: 2
  - dirty: true
  - selectedAliases: []
  - errorId: emptySelection
  - dialogShown: null
