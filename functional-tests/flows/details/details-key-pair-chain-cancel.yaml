id: details-key-pair-chain-cancel
action: KeyPairCertificateChainDetailsAction
slice: details
requires: [file]
tags: [entry-keypair, details]
entry: key-pair-certificate-chain-details
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: true
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12
  - selection:
      - rsa-keypair
when:
  - openDetails:
      kind: keyPairChain
  - cancel: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryCount: 1
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - selectedAliases:
      - rsa-keypair
  - dirty: true
  - errorId: cancelled
  - dialogShown: null
