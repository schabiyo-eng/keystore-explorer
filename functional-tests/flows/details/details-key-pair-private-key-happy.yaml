id: details-key-pair-private-key-happy
action: KeyPairPrivateKeyDetailsAction
slice: details
requires: [file]
tags: [entry-keypair, details]
entry: key-pair-private-key-details
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: true
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12
  - selection:
      - rsa-keypair
when:
  - openDetails:
      kind: keyPairPrivateKey
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryCount: 1
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - selectedAliases:
      - rsa-keypair
  - dirty: true
  - dialogShown: dialog.view-private-key
