id: append-to-certificate-chain-self-signed
action: AppendToCertificateChainAction
slice: chain
requires:
  - file
  - details
tags: [entry-keypair, chain]
entry: append-to-certificate-chain
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: chain/runtime-pkcs12-keypair.p12
        entries:
          - alias: keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection:
      - keypair
when:
  - appendToCertificateChain:
      fixture: cert-pem
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - selectedAliases:
      - keypair
  - dirty: false
  - dialogShown: null
  - errorId: selfSigned
