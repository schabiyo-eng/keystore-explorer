id: remove-from-certificate-chain-too-short
action: RemoveFromCertificateChainAction
slice: chain
requires:
  - file
  - details
tags: [entry-keypair, chain]
entry: remove-from-certificate-chain
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: chain/runtime-pkcs12-keypair.p12
        entries:
          - alias: keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection:
      - keypair
when:
  - removeFromCertificateChain:
      password: TEST_PASSWORD
      confirm: true
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - selectedAliases:
      - keypair
  - dirty: false
  - dialogShown: null
  - errorId: chainTooShort
