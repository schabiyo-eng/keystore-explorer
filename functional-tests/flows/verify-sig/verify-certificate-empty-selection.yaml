id: verify-certificate-empty-selection
action: VerifyCertificateAction
slice: verify-sig
requires:
  - file
tags: [core, verify-sig]
entry: verify-certificate
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection: []
when:
  - verifyCertificate: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - selectedAliases: []
  - dirty: false
  - errorId: emptySelection
  - dialogShown: null
