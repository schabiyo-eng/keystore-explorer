id: verify-signature
action: VerifySignatureAction
slice: verify-sig
requires:
  - file
tags: [core, verify-sig]
entry: verify-signature
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: keypair
            entryType: KEY_PAIR
      - id: trust
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: ca
            entryType: TRUSTED_CERT
  - activeStore: runtime-pkcs12-keypair
  - selection:
      - keypair
when:
  - signFile:
      fixture: unknown-txt
      path: verify-sig/file.p7s
      password: TEST_PASSWORD
  - verifySignature:
      signature: verify-sig/file.p7s
      content: unknown-txt
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - selectedAliases:
      - keypair
  - dirty: false
  - verifyResult: valid
  - dialogShown: dialog.view-signature
  - fileExists:
      path: verify-sig/file.p7s
      exists: true
