id: generate-secret-key
action: GenerateSecretKeyAction
slice: generate
requires:
  - file
tags: [entry-key, generate]
entry: generate-secret-key
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: generate/runtime-pkcs12.p12
  - activeStore: runtime-pkcs12
when:
  - generateSecretKey:
      algorithm: AES
      keySize: 256
      alias: aes-key
  - saveKeyStore:
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - aes-key
  - entryType:
      alias: aes-key
      type: KEY
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - fileExists:
      path: generate/runtime-pkcs12.p12
      exists: true
  - reopenSucceeds: true
