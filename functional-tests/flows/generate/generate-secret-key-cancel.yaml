id: generate-secret-key-cancel
action: GenerateSecretKeyAction
slice: generate
requires:
  - file
tags: [entry-key, generate]
entry: generate-secret-key
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: generate/runtime-pkcs12.p12
  - activeStore: runtime-pkcs12
when:
  - generateSecretKey:
      algorithm: AES
      keySize: 256
      alias: aes-key
  - cancel: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases: []
  - entryCount: 0
  - dirty: false
  - dialogShown: null
  - errorId: cancelled
