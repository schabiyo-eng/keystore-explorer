id: rename-key
action: RenameKeyAction
slice: delete-rename
requires:
  - file
tags: [entry-key, delete-rename]
entry: rename-key
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: delete-rename/runtime-pkcs12.p12
        entries:
          - alias: aes-key
            entryType: KEY
  - activeStore: runtime-pkcs12
  - selection:
      - aes-key
when:
  - renameEntry:
      newAlias: renamed-key
      password: TEST_PASSWORD
  - saveKeyStore:
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - renamed-key
  - entryType:
      alias: renamed-key
      type: KEY
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - fileExists:
      path: delete-rename/runtime-pkcs12.p12
      exists: true
  - reopenSucceeds: true
