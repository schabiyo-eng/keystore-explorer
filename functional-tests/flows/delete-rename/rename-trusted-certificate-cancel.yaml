id: rename-trusted-certificate-cancel
action: RenameTrustedCertificateAction
slice: delete-rename
requires:
  - file
tags: [entry-trusted, delete-rename]
entry: rename-trusted-certificate
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: delete-rename/runtime-pkcs12.p12
        entries:
          - alias: trusted-leaf
            entryType: TRUSTED_CERT
  - activeStore: runtime-pkcs12
  - selection:
      - trusted-leaf
when:
  - renameEntry:
      newAlias: renamed-trusted
  - cancel: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - trusted-leaf
  - entryType:
      alias: trusted-leaf
      type: TRUSTED_CERT
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - errorId: cancelled
