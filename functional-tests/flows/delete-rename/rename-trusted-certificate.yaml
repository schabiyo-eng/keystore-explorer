id: rename-trusted-certificate
action: RenameTrustedCertificateAction
slice: delete-rename
requires:
  - file
tags: [entry-trusted, delete-rename]
entry: rename-trusted-certificate
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: delete-rename/runtime-pkcs12.p12
  - activeStore: runtime-pkcs12
when:
  - importTrustedCertificate:
      fixture: cert-pem
      alias: trusted-leaf
  - selectEntries:
      aliases:
        - trusted-leaf
  - renameEntry:
      newAlias: renamed-trusted
  - saveKeyStore:
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - renamed-trusted
  - entryType:
      alias: renamed-trusted
      type: TRUSTED_CERT
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - fileExists:
      path: delete-rename/runtime-pkcs12.p12
      exists: true
  - reopenSucceeds: true
