id: open-ca-certificates-wrong-password
action: OpenCaCertificatesAction
slice: session
requires:
  - file
tags: [core, session]
entry: open-ca-certificates
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
when:
  - openCaCertificates:
      password: TEST_PASSWORD
  - closeKeyStore:
      saveDirty: false
  - openCaCertificates:
      password: wrong
then:
  - errorId: wrongPassword
  - keystoreOpen: false
  - tabCount: 0
  - fileExists:
      path: ca-certificates.p12
      exists: true
  - dialogShown: dialog.problem
