id: set-key-pair-password
action: SetKeyPairPasswordAction
slice: session
requires:
  - file
tags: [entry-keypair, session]
entry: set-key-pair-password
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: session/runtime-keypair.p12
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12
  - selection:
      - rsa-keypair
when:
  - setKeyPairPassword:
      oldPassword: TEST_PASSWORD
      newPassword: TEST_PASSWORD
  - saveKeyStore:
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryCount: 1
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - selectedAliases:
      - rsa-keypair
  - dirty: false
  - dialogShown: null
  - fileExists:
      path: session/runtime-keypair.p12
      exists: true
  - reopenSucceeds: true
