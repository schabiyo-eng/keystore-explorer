id: change-type-cancel
action: ChangeTypeAction
slice: session
requires:
  - file
tags: [core, session]
entry: change-type
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: session/runtime-pkcs12.p12
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12
when:
  - changeType:
      cancel: true
then:
  - errorId: cancelled
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryCount: 1
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - dirty: false
  - dialogShown: null
