id: unlock-key-pair-wrong-password
action: UnlockKeyPairAction
slice: session
requires:
  - file
tags: [entry-keypair, session]
entry: unlock-key-pair
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: session/runtime-keypair.p12
        entries:
          - alias: rsa-keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12
  - selection:
      - rsa-keypair
when:
  - unlockKeyPair:
      password: wrong
then:
  - errorId: wrongPassword
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - rsa-keypair
  - entryCount: 1
  - entryType:
      alias: rsa-keypair
      type: KEY_PAIR
  - dirty: false
  - locked:
      alias: rsa-keypair
      locked: true
  - dialogShown: dialog.problem
