id: set-key-password-cancel
action: SetKeyPasswordAction
slice: session
requires:
  - file
tags: [entry-key, session]
entry: set-key-password
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: session/runtime-key.p12
        entries:
          - alias: aes-key
            entryType: KEY
  - activeStore: runtime-pkcs12
  - selection:
      - aes-key
when:
  - setKeyPassword:
      cancel: true
then:
  - errorId: cancelled
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - aes-key
  - entryCount: 1
  - entryType:
      alias: aes-key
      type: KEY
  - dirty: false
  - dialogShown: null
