id: authority-certificates-wrong-password
action: AuthorityCertificatesAction
slice: session
requires:
  - file
tags: [core, session]
entry: authority-certificates
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
when:
  - openCaCertificates:
      password: TEST_PASSWORD
  - closeKeyStore:
      saveDirty: false
  - authorityCertificates:
      password: wrong
then:
  - errorId: wrongPassword
  - keystoreOpen: false
  - tabCount: 0
  - dialogShown: dialog.problem
