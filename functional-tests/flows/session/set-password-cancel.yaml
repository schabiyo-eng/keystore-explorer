id: set-password-cancel
action: SetPasswordAction
slice: session
requires:
  - file
tags: [core, session]
entry: set-password
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: session/runtime-pkcs12.p12
  - activeStore: runtime-pkcs12
when:
  - setPassword:
      cancel: true
then:
  - errorId: cancelled
  - keystoreOpen: true
  - type: PKCS12
  - aliases: []
  - entryCount: 0
  - dirty: false
  - historyCanUndo: false
  - dialogShown: null
