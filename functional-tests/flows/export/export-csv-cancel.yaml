id: export-csv-cancel
action: ExportCsvAction
slice: export
requires:
  - file
tags: [core, export]
entry: export-csv
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection:
      - keypair

when:
  - exportCsv:
      path: export/store.csv
  - cancel: {}
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - errorId: cancelled
  - fileExists:
      path: export/store.csv
      exists: false
