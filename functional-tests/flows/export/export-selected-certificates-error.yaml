id: export-selected-certificates-error
action: ExportSelectedCertificatesAction
slice: export
requires:
  - file
tags: [core, export]
entry: export-selected-certificates
skipOn: []
blocked: false
blockedReason: null

given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: keypair
            entryType: KEY_PAIR
          - alias: trust
            entryType: TRUSTED_CERT
  - activeStore: runtime-pkcs12
  - selection: []
when:
  - exportCertificate:
      path: export/selected.cer
      format: X509
      source: selected
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
      - trust
  - entryCount: 2
  - dirty: false
  - selectedAliases: []
  - dialogShown: null
  - errorId: emptySelection
  - fileExists:
      path: export/selected.cer
      exists: false
