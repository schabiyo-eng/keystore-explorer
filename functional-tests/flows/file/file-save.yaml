id: file-save
action: SaveAction
slice: file
requires: []
tags: [core, file]
entry: save
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: true
        path: runtime-pkcs12.p12
        entries: []
  - activeStore: runtime-pkcs12
when:
  - saveKeyStore:
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases: []
  - entryCount: 0
  - dirty: false
  - tabCount: 1
  - fileExists:
      path: runtime-pkcs12.p12
      exists: true
  - reopenSucceeds: true
  - dialogShown: null
  - controlEnabled:
      id: menu.file.save
      enabled: true
  - controlEnabled:
      id: toolbar.save
      enabled: true
