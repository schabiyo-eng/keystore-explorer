id: file-open-pkcs12
action: OpenAction
slice: file
requires: []
tags: [core, file]
entry: open
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
when:
  - newKeyStore:
      type: PKCS12
  - saveKeyStoreAs:
      path: runtime-pkcs12.p12
      password: TEST_PASSWORD
  - closeKeyStore:
      saveDirty: false
  - openKeyStore:
      path: runtime-pkcs12.p12
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases: []
  - entryCount: 0
  - dirty: false
  - tabCount: 1
  - fileExists:
      path: runtime-pkcs12.p12
      exists: true
  - reopenSucceeds: true
  - dialogShown: null
  - controlEnabled:
      id: app.tabs
      enabled: true
  - controlEnabled:
      id: keystore.table
      enabled: true
  - controlEnabled:
      id: menu.file.reload
      enabled: true
