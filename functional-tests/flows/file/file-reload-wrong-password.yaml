id: file-reload-wrong-password
action: ReloadAction
slice: file
requires: []
tags: [core, file]
entry: reload
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        path: runtime-pkcs12.p12
        entries: []
  - activeStore: runtime-pkcs12
when:
  - reloadKeyStore:
      password: wrong
      discardDirty: true
then:
  - errorId: wrongPassword
  - keystoreOpen: true
  - type: PKCS12
  - aliases: []
  - entryCount: 0
  - dirty: false
  - tabCount: 1
  - dialogShown: dialog.error
