id: file-exit
action: ExitAction
slice: file
requires: []
tags: [chrome, file]
entry: exit
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: true
        path: runtime-pkcs12.p12
        entries: []
  - activeStore: runtime-pkcs12
when:
  - exitApp:
      saveDirty: true
then:
  - appExited: true
  - keystoreOpen: false
  - tabCount: 0
  - fileExists:
      path: runtime-pkcs12.p12
      exists: true
  - reopenSucceeds: true
  - dialogShown: null
