id: file-open-wrong-password
action: OpenAction
slice: file
requires: []
tags: [core, file]
entry: open
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
when:
  - newKeyStore:
      type: PKCS12
  - saveKeyStoreAs:
      path: runtime-pkcs12.p12
      password: TEST_PASSWORD
  - closeKeyStore:
      saveDirty: false
  - openKeyStore:
      path: runtime-pkcs12.p12
      password: wrong
then:
  - errorId: wrongPassword
  - keystoreOpen: false
  - tabCount: 0
  - fileExists:
      path: runtime-pkcs12.p12
      exists: true
  - dialogShown: dialog.problem
