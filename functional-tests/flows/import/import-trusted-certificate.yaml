id: import-trusted-certificate
action: ImportTrustedCertificateAction
slice: import
requires:
  - file
tags: [entry-trusted, import]
entry: import-trusted-certificate
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
  - activeStore: runtime-pkcs12
when:
  - importTrustedCertificate:
      fixture: cert-pem
      alias: trust
  - saveKeyStoreAs:
      path: import/trust.p12
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - trust
  - entryType:
      alias: trust
      type: TRUSTED_CERT
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - fileExists:
      path: import/trust.p12
      exists: true
  - reopenSucceeds: true
