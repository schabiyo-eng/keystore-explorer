id: import-trusted-certificate-duplicate-alias
action: ImportTrustedCertificateAction
slice: import
requires:
  - file
tags: [entry-trusted, import]
entry: import-trusted-certificate
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: trust
            entryType: TRUSTED_CERT
  - activeStore: runtime-pkcs12
when:
  - importTrustedCertificate:
      fixture: cert-pem
      alias: trust
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - trust
  - entryType:
      alias: trust
      type: TRUSTED_CERT
  - entryCount: 1
  - dirty: false
  - dialogShown: null
  - errorId: duplicateAlias
