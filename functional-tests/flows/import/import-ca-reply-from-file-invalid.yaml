id: import-ca-reply-from-file-invalid
action: ImportCaReplyFromFileAction
slice: import
requires:
  - file
tags: [entry-keypair, import]
entry: import-ca-reply-from-file
skipOn: []
blocked: false
blockedReason: null
given:
  - appStarted: true
  - openStores:
      - id: runtime-pkcs12-keypair
        type: PKCS12
        password: TEST_PASSWORD
        dirty: false
        entries:
          - alias: keypair
            entryType: KEY_PAIR
  - activeStore: runtime-pkcs12-keypair
  - selection:
      - keypair
when:
  - importCaReplyFromFile:
      fixture: unknown-txt
      password: TEST_PASSWORD
then:
  - keystoreOpen: true
  - type: PKCS12
  - aliases:
      - keypair
  - entryType:
      alias: keypair
      type: KEY_PAIR
  - entryCount: 1
  - selectedAliases:
      - keypair
  - dirty: false
  - dialogShown: null
  - errorId: invalidFile
